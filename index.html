<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage Tracker</title>
  
  <!-- Web App Manifest & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#0070f3">
</head>
<body>

  <h1>Mileage Tracker</h1>

  <!-- 1. Trip Input Form -->
  <section class="card">
    <h2>Log New Trip</h2>
    <form id="mileage-form">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="DoorDash">DoorDash</option>
          <option value="Home Business">Home Business</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="start-odo">Start Odo</label>
          <input type="number" id="start-odo" step="0.1" required placeholder="0.0">
        </div>
        <div class="form-group">
          <label for="end-odo">End Odo</label>
          <input type="number" id="end-odo" step="0.1" required placeholder="0.0">
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <input type="text" id="notes" placeholder="Optional notes (time)">
      </div>

      <button type="submit">Save Trip</button>
    </form>
  </section>

  <!-- 2. Dynamic Summary Card -->
  <section class="card">
    <h2>Category Totals</h2>
    <ul id="summary-list"></ul>
  </section>

  <!-- 3. Actions & Management -->
  <section class="card">
    <h2>Data Management</h2>
    <div style="display: flex; gap: 10px;">
      <button id="export-csv-btn" class="btn-secondary" type="button">Export CSV</button>
      <button id="clear-all-btn" class="btn-danger" type="button">Clear All Trips</button>
    </div>
  </section>

  <!-- 4. Logged Trip History -->
  <section class="card">
    <h2>Logged Trips</h2>
    <ul id="trip-list"></ul>
  </section>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered successfully.', reg))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>

  <!-- Application Modules (Loaded in Strict Sequential Order) -->
  <script src="db.js"></script>
  <script src="analytics.js"></script>
  <script src="export.js"></script>
  <script src="app.js"></script>
</body>
</html>
