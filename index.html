<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Mileage Logger</title>
</head>
<body>

  <h2>Log Mileage</h2>
  <form id="mileage-form">
    <label>
      Category:
      <select id="category" required>
        <option value="DoorDash">DoorDash</option>
        <option value="Home Business">Home Business</option>
        <option value="Personal">Personal</option>
      </select>
    </label><br><br>

    <label>Start Odometer: <input type="number" id="start-odo" step="0.1" required></label><br><br>
    <label>End Odometer: <input type="number" id="end-odo" step="0.1" required></label><br><br>
    <label>Notes: <input type="text" id="notes"></label><br><br>

    <button type="submit">Save Trip</button>
    <button id="export-csv-btn">Export Trips to CSV</button>

<script>
  document.getElementById('export-csv-btn').addEventListener('click', exportTripsToCSV);
</script>
  </form>

  <hr>

  <h2>Logged Trips</h2>
  <ul id="trip-list"></ul>

  <script src="app.js"></script>
  
<br><hr>
  
  <div id="mileage-summary-card">
  <h3>Mileage Totals by Category</h3>
  <ul id="summary-list">
    <!-- Category totals will populate here -->
  </ul>
  <button id="refresh-summary-btn">Recalculate Summary</button>
</div>

<script>
  // Bind click event to recalculate
  document.getElementById('refresh-summary-btn').addEventListener('click', renderMileageSummary);

  // Initial load
  document.addEventListener('DOMContentLoaded', renderMileageSummary);
</script>
</body>
</html>
